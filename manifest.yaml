apiVersion: v1
kind: Plugin
metadata:
  author: jry21223
  name: henu_assistant
  repository: "https://github.com/jry21223/HENU_Assistant"
  version: 1.2.15
  description:
    en_US: "Henan University assistant for Langbot with per-QQ account isolation. Uses LangBot Storage API for persistent storage including schedule data."
    zh_Hans: "河南大学校园助手 Langbot 插件版，支持按 QQ 账号隔离保存学号、密码和课表数据。使用 LangBot Storage API 实现持久化存储。"
  label:
    en_US: HENU Assistant
    zh_Hans: 河大校园助手
  icon: assets/01BA54CCD777C196C1826E2478DC03DB.jpg
spec:
  config: []
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Tool:
      fromDirs:
        - path: components/cli_tools/
execution:
  python:
    path: main.py
    attr: HenuAssistantPlugin

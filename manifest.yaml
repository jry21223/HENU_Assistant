apiVersion: v1
kind: Plugin
metadata:
  author: jry21223
  name: henu_assistant
  repository: "https://github.com/jry21223/HENU_Assistant"
  version: 2.1.0
  description:
    en_US: "Henan University assistant for Langbot with per-QQ isolation, fresh request time context, fail-closed storage, and confirmed external writes."
    zh_Hans: "河南大学校园助手 Langbot 插件版：按 QQ 隔离数据、每请求刷新时间上下文、Storage 故障闭锁、外部写操作二次确认。"
  label:
    en_US: HENU Assistant
    zh_Hans: 河大校园助手
  icon: assets/01BA54CCD777C196C1826E2478DC03DB.jpg
spec:
  config: []
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Tool:
      fromDirs:
        - path: components/cli_tools/
execution:
  python:
    path: main.py
    attr: HenuAssistantPlugin

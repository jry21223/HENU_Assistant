apiVersion: v1
kind: Tool
metadata:
  name: henu_cli
  label:
    en_US: HenuCLI
    zh_Hans: 河大 CLI
  description:
    en_US: "Unified CLI entry for HENU account, schedule, course, empty classroom, library, seminar, 河宝, yuketang, and calibration. Space-style commands only (schedule now), not agent-skill snake_case."
    zh_Hans: "统一 CLI 入口：账号、课表、选课、空教室、图书馆、研讨室、河宝、雨课堂与节次校准。仅使用空格风格命令（如 schedule now），不要使用 agent-skill 的下划线子命令。"
spec:
  parameters:
    type: object
    properties:
      command:
        type: string
        description: CLI 命令，例如 help、account status、schedule now、library current、empty_classroom query、yuketang lesson set --auto-answer on、yuketang login；确认外部写操作时使用 confirm <token>
    required:
      - command
  llm_prompt: "统一入口，只传 command。本插件命令是空格风格（schedule now / library seats / --student-id），禁止使用 agent-skill 的 schedule_query / library_query / --student_id。当前日期和时间只以本轮 [HENU_RUNTIME_CONTEXT_V2] 系统块为准，不得复用历史时间。账号密码、Cookie 和校准 data 必须由用户在私聊中直接发送，插件会在调用模型前拦截；不得通过 Tool 构造或转述这些敏感值。图书馆、研讨室的预约、签到、取消属于外部写操作：首次调用只会返回 confirmation_required 和 confirm <token>；必须等待用户发送下一条明确确认消息，禁止在同一轮自动调用 confirm。查询图书馆时先 locations，再使用返回的准确 location/area_id 查询 seats；不得猜测区域或座位；source=live_empty 时只如实说明为空。空教室用 empty_classroom query；河宝用 yunfz 相关子命令（若 help 列出）。引导雨课堂绑定或登录前，必须提醒用户先在雨课堂设置密码，再使用雨课堂绑定手机号和该密码，不是学校 IDS 密码。雨课堂配置用 yuketang 命令族：lesson/exam 的开关是总闸，黑白名单决定作用范围（黑名单优先，课程名完全匹配）；exam 白名单为空等于考试功能整体关闭；ppt/si/paper 已整体停用不可配置；--x-access-token 属敏感值，必须由用户在私聊中单独直发 `yuketang exam set --x-access-token '<token>'`，模型不得构造、转述或拼进其他命令；`yuketang account set`（含密码）同样仅私聊直发、由插件拦截；`yuketang login` 同样仅私聊、由插件直接处理（账号密码登录，先回执再后台返回结果），群聊发送会被拒绝，模型不要替用户执行或催促。工具返回 reply_text 时优先复述 reply_text，不发送完整 JSON。日期示例统一使用 YYYY-MM-DD。所有真实写操作仅以 success=true 或 external_committed=true 为准；若 external_committed=true 且 storage_persisted=false，禁止重试，先反查当前记录。雨课堂凭据由插件加密保存候选并要求下一条 yuketang confirm 确认；模型不得代为确认。启用、配置和课程范围变更需下一条 confirm；整体 disable 直接执行。雨课堂 success 只代表本地操作成功，bridge=pending 不能声称远端已停止，synced 仅代表桥端接收；daemon_wired=false 时不得承诺任务执行。不确定参数时先 help 或 help <topic>。"
execution:
  python:
    path: henu_cli_safe.py
    attr: HenuCliSafe

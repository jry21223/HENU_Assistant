apiVersion: v1
kind: Tool
metadata:
  name: henu_cli
  label:
    en_US: HenuCLI
    zh_Hans: 河大 CLI
  description:
    en_US: "Unified CLI entry for HENU campus commands, one-shot library scheduling, KIT member benefits and Qingmu platform orders. Service fees are included and paid by the operator. New yuketang actions remain unavailable until executor B is upgraded and accepted; status, disable and logout remain available. Space-style commands only (schedule now), not agent-skill snake_case."
    zh_Hans: "统一 CLI 入口：校园功能、图书馆一次性定时预约、KIT会员权益和青木平台订单。会员服务费用包含、站方承担；雨课堂新操作等待B执行端升级验收，状态、停用和退出仍可操作。仅使用空格风格命令（如 schedule now），不要使用 agent-skill 的下划线子命令。"
spec:
  parameters:
    type: object
    properties:
      command:
        type: string
        description: CLI 命令，例如 help、account status、schedule now、library current、library schedule list、library schedule status --id <任务号>、qingmu status、qingmu courses --platform ucampus、empty_classroom query、yuketang status、yuketang disable、yuketang logout。校园即时写操作须本人下一条真实消息确认；订单及定时预约仅本人原私聊后续确认，定时预约回复“确认定时预约”，模型不得调用确认或传递令牌。
    required:
      - command
  llm_prompt: >-
    统一入口，只传 command。本插件命令为空格风格（schedule now / library seats / --student-id），
    禁止使用 agent-skill 的 schedule_query / library_query / --student_id。
    当前日期和时间只以本轮 [HENU_RUNTIME_CONTEXT_V2] 系统块为准，不得复用历史时间。
    账号密码、Cookie、Token 和校准 data 必须由用户在私聊中直接发送，插件会在模型前拦截；
    不得通过 Tool 构造、转述或传递这些敏感值。
    图书馆、研讨室即时预约、签到、取消属于外部写操作：首次调用仅返回 confirmation_required；
    必须等待本人下一条真实消息确认，由插件处理，模型不得代确认、构造令牌或调用 confirm。
    图书馆查询先 locations，再用返回的准确 location/area_id 查询 seats，不得猜区域或座位；
    source=live_empty 时如实说明为空。空教室用 empty_classroom query，河宝使用 help 列出的 yunfz 子命令。
    图书馆定时预约使用 library schedule add/list/status/cancel，一次性任务，不是每日循环。
    add 明确指定 --run-at 'YYYY-MM-DDTHH:MM:SS+08:00'、--location、--seat-no、--date、--time、--end-time；
    --run-at 是未来30天内东八区提交预约时刻，--date/--time/--end-time 是座位使用日期与时段，两者分别确认，不得猜日期时间。
    预览不提交学校预约；必须等待本人在原私聊下一条回复“确认定时预约”，模型不能调用确认或传递确认令牌。
    list/status/cancel 仅查本人任务；取消未确认预览用 library schedule cancel --id awaiting。
    pending 可取消；running/unknown/succeeded 不得重单，unknown 先查学校实际记录，missed 不自动补发。
    定时预约创建确认和执行时都重新核实KIT终身会员与原学校账号；状态和取消不因会员失效而锁住。
    会员包含雨课堂、U校园（含AI版）、学习通及图书馆定时预约权益，服务费用由站方承担，无需另付费或扣积分。
    会员资格故障或非会员不得发起新业务操作，不得用本地boolean或历史资格代替权威检查。
    当前雨课堂B执行端未完成逐动作会员约束升级与验收：新的绑定、Token设置、登录、启用、配置与范围修改均不可用，
    返回不可用提示，不验证新凭据或发起实际登录；不得引导用户为这些未开放操作提供密码/Token，不得承诺后台登录或自动执行。
    当前仅 yuketang status、yuketang disable、yuketang logout 保留；私聊自然语言新登录同样返回不可用。
    雨课堂本地 success 只代表本地操作，bridge=pending 不证明远端已停止，synced 只代表桥端接收；
    daemon_wired=true 不证明会员门已接入，daemon_wired=false 不得承诺执行。存量远端是否停止尚需核实。
    B源码升级、逐动作资格门和真实执行器验收完成后才可重新开放新雨课堂操作，不把历史兼容流程当作当前能力。
    青木使用 qingmu 命令族，平台为 ucampus、ucampus_ai、chaoxing；账号和订单只允许本人私聊。
    绑定密码不能经由 Tool，用户本人私聊直接发送，插件拦截并加密保存。
    先查课，再用返回序号预览下单；提交订单和补刷必须本人下一条真实确认，模型不得调用 qingmu confirm。
    orders 是本地回执，order status 用本地订单号查询上游；受理不等于课程完成。
    不展示供应商采购价/余额为会员应付，不猜服务编号、订单号、实际价格；接口未配置时如实说明。
    工具返回 reply_text 时优先复述，不发送完整 JSON；日期占位示例使用 YYYY-MM-DD。
    所有真实写操作仅以 success=true 或 external_committed=true 为准；
    outcome=unknown 或 storage_persisted=false 时禁止重试，先反查学校/供应商记录。
    不确定参数时先 help 或 help <topic>。
execution:
  python:
    path: henu_cli_safe.py
    attr: HenuCliSafe

apiVersion: v1
kind: Tool
metadata:
  name: henu_cli
  label:
    en_US: HenuCLI
    zh_Hans: 河大 CLI
  description:
    en_US: "Unified CLI entry for HENU account, schedule, course, empty classroom, library, seminar, 河宝, yuketang, and calibration. Space-style commands only (schedule now), not agent-skill snake_case."
    zh_Hans: "统一 CLI 入口：账号、课表、选课、空教室、图书馆、研讨室、河宝、雨课堂与节次校准。仅使用空格风格命令（如 schedule now），不要使用 agent-skill 的下划线子命令。"
spec:
  parameters:
    type: object
    properties:
      command:
        type: string
        description: CLI 命令，例如 help、preferences get、preferences set --library-location <区域> --library-seat-no <座位>、preferences clear --library-seat-no、account status、schedule now、library current、empty classroom query、yuketang lesson set --auto-answer on、yuketang login；偏好仅私聊管理，不代表预约授权；确认时用户下一条直接回复“确认”，由插件处理
    required:
      - command
  llm_prompt: "用户菜单入口映射：我的状态→account status；今天课表/明天课表→schedule day --date YYYY-MM-DD（日期仅按本轮校园时间计算）；下一节课→schedule now；同步课表→schedule sync；图书馆座位→library locations；用户已给区域、日期和起止时间时直接接着查询 library seats --area-id <实际ID> --date YYYY-MM-DD --time HH:MM --end-time HH:MM，不重复问、不要求逐级选菜单；空教室先按已有信息查询，仅补问工具返回的必要缺项，不猜教学周；未指定节次时可查全天，不重复询问已自动识别的学期。首次使用用中文解释校园账号与网站账号分别绑定。按用户目标自主选择工具，可连续完成多个必要只读查询后综合回答；沿用上下文、接受中途改口，缺必要信息才问，不展开整份CLI帮助。课前提醒由用户私聊直接发送“开启课前提醒”“关闭课前提醒”“课前提醒”或“测试课前提醒”设置，默认课前15分钟，连堂课一次；模型不代用户开启，不以接口受理声称实际送达。保存密码不等于登录有效，绑定成功与学校验证结果分别说明。统一入口，只传 command。本插件命令是空格风格（schedule now / library seats / --student-id），禁止使用 agent-skill 的 schedule_query / library_query / --student_id。当前日期和时间只以本轮 [HENU_RUNTIME_CONTEXT_V2] 系统块为准，不得复用历史时间。账号密码、Cookie 和校准 data 必须由用户在私聊中直接发送，插件会在调用模型前拦截；不得通过 Tool 构造或转述这些敏感值。图书馆预约必须由用户明确确认日期、开始和结束时间；仅用户明确接受服务端完整时段时才传 --end-policy server_full_slot，查询默认值不构成写入授权。图书馆、研讨室的预约、签到、取消属于外部写操作：首次调用只会返回 confirmation_required，并提示用户下一条直接回复“确认”；必须等待用户发送下一条明确确认消息，模型不得代确认或构造令牌，必须由用户下一条原文“确认”触发插件。查询图书馆时先 locations，再使用返回的准确 location/area_id 查询 seats；不得猜测区域或座位；source=live_empty 时只如实说明为空。空教室用 empty classroom query；河宝用 yunfz 相关子命令（若 help 列出）。引导雨课堂绑定或登录前，必须提醒用户先在雨课堂设置密码，再使用雨课堂绑定手机号和该密码，不是学校 IDS 密码。雨课堂总开关默认关闭，课堂自动进班/自动答题/大模型子开关默认开启，显式 off 保持不变。--auto-enter off 停止课堂进班/答题，不影响考试。用户可私聊说登录雨课堂、重新登录雨课堂、退出登录雨课堂，插件直接处理；退出不删除绑定。雨课堂配置用 yuketang 命令族：lesson/exam 的开关是总闸，黑白名单决定作用范围（黑名单优先；考试白名单匹配班级标签，新增可输入课程名并由插件实时解析）；exam 白名单为空等于考试功能整体关闭；先用 yuketang courses 查询课程名与班级标签，用 yuketang exam list --course <课程名或班级标签> 只读查看考试；考试白名单新增在用户确认后核验唯一班级，多个班级或查询失败不保存，含空格标签加引号；remove 使用已保存标签；只读查询不生成令牌、不开始考试、不读题目、不提交答案；ppt/si/paper 已整体停用不可配置；--x-access-token 属敏感值，必须由用户在私聊中单独直发 `yuketang exam set --x-access-token '<token>'`，模型不得构造、转述或拼进其他命令；`yuketang account set`（含密码）同样仅私聊直发、由插件拦截；`yuketang login` 同样仅私聊、由插件直接处理（账号密码登录，先回执再后台返回结果），群聊发送会被拒绝，模型不要替用户执行或催促。工具返回 reply_text 是事实摘要，按用户问题筛选和综合，不机械复述、不发送完整 JSON；next_commands 是参考而非固定流程或授权；用户只查不约时不创建预约预览。日期示例统一使用 YYYY-MM-DD。所有真实写操作仅以 success=true 或 external_committed=true 为准；若 external_committed=true 且 storage_persisted=false，禁止重试，先反查当前记录。雨课堂凭据由插件加密保存候选并要求用户下一条私聊直接回复“确认”；模型不得代为确认。启用、配置和课程范围变更需用户下一条回复“确认”；整体 disable 直接执行。雨课堂 success 只代表本地操作成功，bridge=pending 不能声称远端已停止，synced 仅代表桥端接收；daemon_wired=false 时不得承诺任务执行。考试需本人在官方页面开始，后台接管登录可能导致其他设备登录提示；后台作答时避免反复重登，保存答案后本人检查并正式交卷；插件没有自动交卷命令。同一雨课堂账号只启用一个聊天身份监听，防止重复覆盖答案；现 Bridge 没有已核验的账号排他协议，不能承诺全局去重。yuketang status 的 monitoring_state 仅表示监听注册状态，需 config_hash_matches、当前身份注册和新鲜心跳共同核验；exam_submission_state=not_checked 表示尚未核验答题与交卷，禁止用 synced、心跳或预计耗时声称全部答完/已交卷。雨课堂未知、重复、缺值或多余参数将整条拒绝。不确定参数时先 help 或 help <topic>。"
execution:
  python:
    path: henu_cli_safe.py
    attr: HenuCliSafe

apiVersion: v1
kind: Tool
metadata:
  name: henu_cli
  label:
    en_US: HenuCLI
    zh_Hans: 河大 CLI
  description:
    en_US: "Unified CLI-style entry for HENU account, schedule, course selection, library, seminar, and calibration operations."
    zh_Hans: "统一 CLI 风格入口，用一条 command 调用河大账号、课表、选课、图书馆、研讨室与节次校准能力。"
spec:
  parameters:
    type: object
    properties:
      command:
        type: string
        description: CLI 风格命令字符串，例如 help、account status、schedule now、course status、library current
    required:
      - command
  llm_prompt: "统一入口，只传 `command`。渐进式披露：先用 `help` 看一级命令，再用 `help <topic>` 看更窄主题；不确定参数时不要一次展开全部。工具返回 `reply_text` 时，最终回复必须优先直接复述或压缩 `reply_text`，不要把完整 JSON 发给用户；除非用户明确要求翻页、筛选、预约或继续执行，否则不要重复调用 henu_cli。图书馆先调用 `library locations`，必须使用返回的 `locations[].location` 或 `locations[].area_id`，禁止凭记忆猜区域名；再调用 `library seats` 查询座位，预约必须使用返回的准确座位号并先确认日期、时间和区域。常用命令：`account status`、`account set --student-id ... --password ...`、`schedule now`、`course status`、`course plan --excel ./courses.xlsx --class 25软工1`、`course plan --candidates-json '<json>'`、`course monitor config --config-json '<json>'`、`course monitor once`、`course monitor run --max-checks 3`、`library current`、`library locations --date 2026-03-30`、`library seats --location ... --date 2026-03-30 --time 08:00`、`library reserve --location ... --seat-no ... --date 2026-03-30 --time 08:00 --end-time 12:00`、`library reserve --location ... --seat-no ... --retry-until 08:05 --max-attempts 30`、`seminar rooms --date 2026-03-30 --start 14:00 --end 16:00 --members 4`、`empty_classroom query --week 1 --day-of-week 1 --period 1`、`empty_classroom query --view occupancy --classroom-text 十号楼101`、`resource search 十号楼101`。`course status` 和 `course monitor` 只读查询/提醒；`course submit` 当前不执行真实提交。参数值包含空格时要加引号。所有真实写操作只以返回 `success=true` 为准。"
execution:
  python:
    path: henu_cli_safe.py
    attr: HenuCliSafe

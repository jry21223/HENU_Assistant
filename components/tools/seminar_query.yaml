apiVersion: v1
kind: Tool
metadata:
  name: seminar_query
  label:
    en_US: SeminarQuery
    zh_Hans: 查询研讨室
  description:
    en_US: "Query seminar room filters, rooms, details, records, or signin tasks."
    zh_Hans: "查询研讨室筛选项、房间列表、详情、预约记录或签到任务。"
spec:
  parameters:
    type: object
    properties:
      view:
        type: string
        enum: [filters, rooms, detail, records, signin_tasks]
        description: 查询视图，默认 rooms
      target_date:
        type: string
        description: 日期，格式 YYYY-MM-DD
      members:
        type: integer
        description: 参与人数
      name:
        type: string
        description: 房间名关键词
      room:
        type: string
        description: 房间编号关键词
      start_time:
        type: string
        description: 开始时间 HH:MM
      end_time:
        type: string
        description: 结束时间 HH:MM
      library_ids:
        type: string
      library_names:
        type: string
      floor_ids:
        type: string
      floor_names:
        type: string
      category_ids:
        type: string
      category_names:
        type: string
      boutique_ids:
        type: string
      boutique_names:
        type: string
      page:
        type: integer
        description: 页码，默认 1
      area_id:
        type: string
        description: 当 view=detail 时必填
      record_type:
        type: string
        description: records 视图使用，默认 1
      limit:
        type: integer
        description: records 视图每页数量，默认 20
      mode:
        type: string
        description: books 或 reneges，默认 books
      status:
        type: string
        description: signin_tasks 视图筛选状态
  llm_prompt: "查询当前 QQ 账号对应用户的研讨室可预约信息和记录。"
execution:
  python:
    path: seminar_query.py
    attr: SeminarQuery

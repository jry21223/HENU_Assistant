apiVersion: v1
kind: Tool
metadata:
  name: seminar_signin
  label:
    en_US: SeminarSignin
    zh_Hans: 研讨室签到
  description:
    en_US: "Sign in to a seminar reservation or scan due signin tasks."
    zh_Hans: "对指定研讨室预约签到，或扫描当前 QQ 账号的待签到任务。"
spec:
  parameters:
    type: object
    properties:
      record_id:
        type: string
        description: 指定预约记录 ID
      auto_scan:
        type: boolean
        description: 是否扫描当前账号保存的待签到任务，默认 false
  llm_prompt: "执行前先确认当前 server_time；如果本轮结果里已有 server_time_snapshot，则必须以该时间为准。执行真实的研讨室签到。插件版支持手动扫描当前 QQ 账号保存的签到任务。"
execution:
  python:
    path: seminar_signin.py
    attr: SeminarSignin

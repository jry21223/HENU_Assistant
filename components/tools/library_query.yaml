apiVersion: v1
kind: Tool
metadata:
  name: library_query
  label:
    en_US: LibraryQuery
    zh_Hans: 查询图书馆
  description:
    en_US: "Query library locations, current reservations, or records."
    zh_Hans: "查询图书馆区域、当前预约或历史预约记录。"
spec:
  parameters:
    type: object
    properties:
      view:
        type: string
        enum: [locations, current, records]
        description: 查询视图，默认 current
      record_type:
        type: string
        description: 记录类型，默认 1
      page:
        type: integer
        description: 页码，默认 1
      limit:
        type: integer
        description: 每页数量，默认 20
  llm_prompt: "如需判断今天、明天、现在、当前预约、是否过期等相对时间，先调用 system_status 获取 server_time；如果本轮结果里已有 server_time_snapshot，则必须以该时间为准。查询当前 QQ 账号绑定用户的图书馆相关信息。"
execution:
  python:
    path: library_query.py
    attr: LibraryQuery

apiVersion: v1
kind: Tool
metadata:
  name: set_calibration_source
  label:
    en_US: SetCalibrationSource
    zh_Hans: 设置节次校准源
  description:
    en_US: "Update the shared xiqueer calibration source."
    zh_Hans: "更新共享的 xiqueer 抓包校准源。"
spec:
  parameters:
    type: object
    properties:
      data:
        type: string
        description: 抓包得到的请求体 data
      cookie:
        type: string
        description: 抓包得到的 Cookie
      user_agent:
        type: string
        description: 可选，自定义 User-Agent
    required:
      - data
      - cookie
  llm_prompt: "更新全插件共享的节次校准源，用于自动校准上课节次时间。"
execution:
  python:
    path: set_calibration_source.py
    attr: SetCalibrationSource

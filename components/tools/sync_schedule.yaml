apiVersion: v1
kind: Tool
metadata:
  name: sync_schedule
  label:
    en_US: SyncSchedule
    zh_Hans: 同步课表
  description:
    en_US: "Fetch the latest schedule for the current QQ account."
    zh_Hans: "使用当前 QQ 账号绑定的河大凭据同步最新课表。"
spec:
  parameters:
    type: object
    properties:
      xn:
        type: string
        description: 学年，可留空
      xq:
        type: string
        description: 学期，可留空
      auto_calibrate:
        type: boolean
        description: 是否自动校准节次时间，默认 true
  llm_prompt: "从教务系统抓取当前 QQ 账号绑定用户的真实课表，并保存到该 QQ 对应的独立 output 目录。"
execution:
  python:
    path: sync_schedule.py
    attr: SyncSchedule

apiVersion: v1
kind: Tool
metadata:
  name: seminar_cancel
  label:
    en_US: SeminarCancel
    zh_Hans: 取消研讨室预约
  description:
    en_US: "Cancel a seminar room reservation."
    zh_Hans: "取消研讨室预约。"
spec:
  parameters:
    type: object
    properties:
      record_id:
        type: string
        description: 预约记录 ID
    required:
      - record_id
  llm_prompt: "执行前先确认当前 server_time；如果本轮结果里已有 server_time_snapshot，则必须以该时间为准。执行真实的研讨室预约取消。只有返回 success=true 才代表取消成功。"
execution:
  python:
    path: seminar_cancel.py
    attr: SeminarCancel

apiVersion: v1
kind: Tool
metadata:
  name: system_status
  label:
    en_US: SystemStatus
    zh_Hans: 系统状态
  description:
    en_US: "Show account, time, schedule outputs, and storage info for the current QQ account."
    zh_Hans: "查看当前 QQ 账号对应的账号状态、服务器时间、输出文件和存储路径。"
spec:
  parameters:
    type: object
    properties:
      timezone:
        type: string
        description: 时区，默认 Asia/Shanghai
  llm_prompt: "查询当前 QQ 账号对应的插件运行状态，用于时间判断和账号状态确认。"
execution:
  python:
    path: system_status.py
    attr: SystemStatus

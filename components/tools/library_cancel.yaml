apiVersion: v1
kind: Tool
metadata:
  name: library_cancel
  label:
    en_US: LibraryCancel
    zh_Hans: 取消图书馆预约
  description:
    en_US: "Cancel a library reservation."
    zh_Hans: "取消图书馆预约。"
spec:
  parameters:
    type: object
    properties:
      record_id:
        type: string
        description: 预约记录 ID
      record_type:
        type: string
        description: auto 或具体记录类型
    required:
      - record_id
  llm_prompt: "执行真实的图书馆预约取消。只有返回 success=true 才代表取消成功。"
execution:
  python:
    path: library_cancel.py
    attr: LibraryCancel

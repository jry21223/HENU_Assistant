apiVersion: v1
kind: Tool
metadata:
  name: library_auto_signin
  label:
    en_US: LibraryAutoSignin
    zh_Hans: 图书馆签到
  description:
    en_US: "Sign in to the current or specified library reservation."
    zh_Hans: "对当前或指定图书馆预约执行自动签到。"
spec:
  parameters:
    type: object
    properties:
      record_id:
        type: string
        description: 指定预约记录 ID，可留空自动选择当前可签到记录
  llm_prompt: "执行真实的图书馆签到操作，不要假装签到成功。"
execution:
  python:
    path: library_auto_signin.py
    attr: LibraryAutoSignin

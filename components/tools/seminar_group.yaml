apiVersion: v1
kind: Tool
metadata:
  name: seminar_group
  label:
    en_US: SeminarGroup
    zh_Hans: 管理研讨室分组
  description:
    en_US: "Manage seminar room member groups."
    zh_Hans: "查看、保存或删除研讨室预约成员分组。"
spec:
  parameters:
    type: object
    properties:
      action:
        type: string
        enum: [list, save, delete]
        description: 操作类型，默认 list
      group_name:
        type: string
        description: 分组名称
      member_ids:
        type: string
        description: 成员学号列表，逗号或空格分隔
      note:
        type: string
        description: 备注
  llm_prompt: "管理当前 QQ 账号对应用户的研讨室预约成员分组。"
execution:
  python:
    path: seminar_group.py
    attr: SeminarGroup

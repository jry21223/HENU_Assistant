<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">校园能力一览</title>
  <desc id="desc">课表、选课状态与规划、空教室、资源映射、图书馆、研讨室、河宝社区与节次校准等能力模块。</desc>

  <rect width="1200" height="360" rx="28" fill="#f7f4ed"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#0f4c81" stroke-opacity="0.08"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif">
    <text x="48" y="54" fill="#0f4c81" font-size="28" font-weight="750">能做什么</text>
    <text x="48" y="88" fill="#5a728a" font-size="18">本地账号绑定 · 加密保存 · 只读监控优先 · 不上传第三方</text>

    <!-- row of capability cards -->
    <g font-size="20" font-weight="700" fill="#0f4c81">
      <g transform="translate(48 120)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">课表</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">同步 / 当前 / 日 / 周 / 全量</text>
      </g>
      <g transform="translate(328 120)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">选课</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">状态查询 · 智能规划 · 余量监控</text>
      </g>
      <g transform="translate(608 120)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">空教室</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">空闲查询 · 占用 · 资源映射</text>
      </g>
      <g transform="translate(888 120)">
        <rect width="264" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">图书馆</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">区域 · 座位 · 预约 · 签到</text>
      </g>

      <g transform="translate(48 232)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">研讨室</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">筛选 · 分组 · 预约 · 签到</text>
      </g>
      <g transform="translate(328 232)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">河宝社区</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">请假 · 签到 · 查寝 · 活动</text>
      </g>
      <g transform="translate(608 232)">
        <rect width="260" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">认证</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">IDS 优先 · Kingo 一次降级</text>
      </g>
      <g transform="translate(888 232)">
        <rect width="264" height="92" rx="16" fill="#ffffff" stroke="#0f4c81" stroke-opacity="0.12"/>
        <text x="22" y="40">校准</text>
        <text x="22" y="70" font-size="16" font-weight="500" fill="#5a728a">节次时间源 · 系统状态</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">河南大学校园助手</title>
  <desc id="desc">本地可运行的河大校园助手。同一套能力，通过 MCP、Langbot、Agent Skill 三种方式交付。</desc>

  <!-- solid field, no grid, no gradient chrome -->
  <rect width="1200" height="320" rx="20" fill="#0c1f33"/>

  <!-- left accent bar as the only motif -->
  <rect x="0" y="0" width="8" height="320" rx="0" fill="#c9a227"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif">
    <!-- category -->
    <text x="64" y="72" fill="#8aa0b5" font-size="16" font-weight="600" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">HENU  ·  CAMPUS ASSISTANT</text>

    <!-- name -->
    <text x="64" y="140" fill="#f4f1ea" font-size="48" font-weight="700">河南大学校园助手</text>

    <!-- one concrete line -->
    <text x="64" y="188" fill="#b8c7d6" font-size="22">本地课表、空教室、图书馆、研讨室与河宝查询</text>

    <!-- delivery as plain mono labels, not cards -->
    <text x="64" y="248" fill="#c9a227" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">MCP</text>
    <text x="130" y="248" fill="#5f7388" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/</text>
    <text x="152" y="248" fill="#c9a227" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Langbot</text>
    <text x="258" y="248" fill="#5f7388" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/</text>
    <text x="280" y="248" fill="#c9a227" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Agent Skill</text>

    <text x="64" y="286" fill="#6d8298" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">MIT  ·  local-only data  ·  IDS-first auth</text>
  </g>
</svg>

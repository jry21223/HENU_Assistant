name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Select frozen lock
        id: lock
        run: echo "path=$(python scripts/select_lockfile.py --check)" >> "$GITHUB_OUTPUT"

      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes -r "${{ steps.lock.outputs.path }}"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit the frozen application lock
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/python -m pip_audit --progress-spinner off --disable-pip --no-deps -r "${{ steps.lock.outputs.path }}"

      - name: Compile source
        run: python -m compileall -q campus_core henu_mcp mcp_server.py diagnose_mcp.py scripts

      - name: Run full test suite
        run: python -m pytest

      - name: Run diagnostics
        run: python diagnose_mcp.py

      - name: Run real stdio protocol smoke
        run: python scripts/stdio_smoke.py

  legacy-client:
    name: MCP 1.29 real client compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up server Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Select frozen server lock
        id: server-lock
        run: echo "path=$(python scripts/select_lockfile.py --python-version 3.11 --check)" >> "$GITHUB_OUTPUT"

      - name: Install hash-verified MCP 2 server dependencies
        run: python -m pip install --require-hashes -r "${{ steps.server-lock.outputs.path }}"

      - name: Build isolated MCP 1.29 client environment
        run: |
          python -m venv .legacy-client
          .legacy-client/bin/python -m pip install --require-hashes -r requirements-lock/mcp129-client-py311.txt

      - name: Run MCP 1.29 client against MCP 2 server
        run: |
          .legacy-client/bin/python scripts/legacy_stdio_smoke.py \
            --server-python "$(command -v python)" \
            --server-root "$GITHUB_WORKSPACE"

name: Test LangBot plugin

on:
  pull_request:
    branches:
      - langbot-plugin
  push:
    branches:
      - langbot-plugin
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock/*.txt

      - name: Select frozen lock
        id: lock
        run: echo "path=$(python scripts/select_lockfile.py --check)" >> "$GITHUB_OUTPUT"

      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes -r "${{ steps.lock.outputs.path }}"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit the frozen application lock
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/python -m pip_audit --progress-spinner off --disable-pip --no-deps -r "${{ steps.lock.outputs.path }}"

      - name: Compile plugin
        run: python -m compileall -q components henu_plugin henu_mcp campus_core main.py mcp_server.py scripts

      - name: Run tests
        run: python -m pytest -q
